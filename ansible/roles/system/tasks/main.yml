---
- name: Install controller packages
  ansible.builtin.apt:
    name:
      - ansible
      - ca-certificates
      - openssh-client
      - curl
      - iputils-arping
      - iputils-ping
      - jq
      - python3-jinja2
      - python3-yaml
      - rsync
      - tcpdump
      - unattended-upgrades
      - vlan
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the controller hostname
  ansible.builtin.hostname:
    name: "{{ deployment.hostname }}"

- name: Apply the controller timezone
  ansible.builtin.command:
    argv: ["timedatectl", "set-timezone", "{{ deployment.timezone }}"]
  changed_when: true

- name: Disable systemd-timesyncd so it does not fight MAAS time sync
  ansible.builtin.systemd:
    name: systemd-timesyncd.service
    enabled: false
    state: stopped
  failed_when: false

- name: Keep security updates unattended and leave MAAS upgrades manual
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Limit unattended upgrades to the security pocket
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52maas-provision-upgrades
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Disable IP forwarding
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-maas-provision.conf
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 0
      net.ipv6.conf.all.forwarding = 0
  notify: Reload sysctl

- name: Create provisioning state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - /var/lib/maas-provision
    - /var/log/maas-provision
    - /etc/maas-provision
    - "{{ deployment.backup.directory }}"

- name: Apply system safety settings before starting MAAS
  ansible.builtin.meta: flush_handlers
