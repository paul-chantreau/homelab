name: Build MAAS autoinstall ISO

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible ansible-lint python3-jsonschema python3-pytest python3-yaml

      - name: Validate the committed configuration schema
        run: python3 scripts/validate-config.py --mode schema --network config/network.yaml --deployment config/deployment.yaml

      - name: Run unit tests
        run: python3 -m pytest -q

      - name: Check Ansible syntax
        working-directory: ansible
        run: ansible-playbook --syntax-check install.yml

      - name: Lint Ansible
        run: ansible-lint ansible/install.yml

  iso:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-jinja2 python3-yaml xorriso curl ca-certificates

      - name: Build the autoinstall ISO
        run: |
          chmod +x scripts/*.sh
          scripts/build-iso.sh

      - name: Upload the ISO, checksum, and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-maas-autoinstall
          path: |
            build/ubuntu-maas-autoinstall.iso
            build/SHA256SUMS
            build/build-manifest.json
          if-no-files-found: error
          retention-days: 14
