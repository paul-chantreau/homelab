name: Build MAAS autoinstall ISO

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ansible \
            ansible-lint \
            python3-jsonschema \
            python3-pytest \
            python3-yaml \
            openssh-client \
            xorriso \
            mtools \
            grub-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            qemu-system-x86

      - name: Validate the committed configuration schema
        run: python3 scripts/validate-config.py --mode schema --network config/network.yaml --deployment config/deployment.yaml

      - name: Run unit and isolated PostgreSQL integration tests
        env:
          HOMELAB_TEST_POSTGRES: '1'
        run: python3 -m pytest -q

      - name: Check Ansible syntax
        working-directory: ansible
        run: |
          # The runner image ships a newer Ansible on PATH. Lint imports the
          # apt module, so both commands must use the apt CLI.
          export PATH="/usr/bin:${PATH}"
          ansible-playbook --version
          ansible-playbook --syntax-check install.yml

      - name: Lint Ansible
        run: |
          export PATH="/usr/bin:${PATH}"
          ansible --version
          ansible-lint ansible/install.yml

  iso:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client python3-jinja2 python3-yaml xorriso curl ca-certificates

      - name: Check variables and prepare installation configuration
        uses: ./.github/actions/check-variables
        with:
          variables-json: ${{ toJSON(vars) }}
          secrets-json: |
            {
              "SWITCH_ROUTER_PORT": ${{ toJSON(secrets.SWITCH_ROUTER_PORT) }},
              "SWITCH_MAAS_PORT": ${{ toJSON(secrets.SWITCH_MAAS_PORT) }},
              "SWITCH_PROVISIONING_PORTS": ${{ toJSON(secrets.SWITCH_PROVISIONING_PORTS) }},
              "MANAGEMENT_INTERFACE_MAC": ${{ toJSON(secrets.MANAGEMENT_INTERFACE_MAC) }},
              "MANAGEMENT_ADDRESS": ${{ toJSON(secrets.MANAGEMENT_ADDRESS) }},
              "MANAGEMENT_GATEWAY": ${{ toJSON(secrets.MANAGEMENT_GATEWAY) }},
              "MANAGEMENT_DNS": ${{ toJSON(secrets.MANAGEMENT_DNS) }},
              "MANAGEMENT_VLAN_ID": ${{ toJSON(secrets.MANAGEMENT_VLAN_ID) }},
              "PROVISIONING_VLAN_ID": ${{ toJSON(secrets.PROVISIONING_VLAN_ID) }},
              "PROVISIONING_SUBNET": ${{ toJSON(secrets.PROVISIONING_SUBNET) }},
              "PROVISIONING_CONTROLLER_ADDRESS": ${{ toJSON(secrets.PROVISIONING_CONTROLLER_ADDRESS) }},
              "PROVISIONING_DHCP_START": ${{ toJSON(secrets.PROVISIONING_DHCP_START) }},
              "PROVISIONING_DHCP_END": ${{ toJSON(secrets.PROVISIONING_DHCP_END) }},
              "PROVISIONING_TEST_HOST": ${{ toJSON(secrets.PROVISIONING_TEST_HOST) }},
              "DISK_SERIAL": ${{ toJSON(secrets.DISK_SERIAL) }},
              "DISK_WWN": ${{ toJSON(secrets.DISK_WWN) }},
              "DISK_BY_ID": ${{ toJSON(secrets.DISK_BY_ID) }}
            }
          write-config: 'true'

      - name: Build the autoinstall ISO
        run: |
          chmod +x scripts/*.sh
          scripts/build-iso.sh

      - name: Upload the ISO, checksum, and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-maas-autoinstall
          path: |
            build/ubuntu-maas-autoinstall.iso
            build/SHA256SUMS
            build/build-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove resolved configuration from the runner
        if: always()
        shell: bash
        run: |
          rm -f config/network.yaml config/deployment.yaml
          rm -f build/ubuntu-maas-autoinstall.iso
