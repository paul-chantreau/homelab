name: Build MAAS autoinstall ISO

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ansible \
            ansible-lint \
            python3-jsonschema \
            python3-pytest \
            python3-yaml \
            xorriso \
            mtools \
            grub-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            qemu-system-x86

      - name: Validate the committed configuration schema
        run: python3 scripts/validate-config.py --mode schema --network config/network.yaml --deployment config/deployment.yaml

      - name: Run unit tests
        run: python3 -m pytest -q

      - name: Check Ansible syntax
        working-directory: ansible
        run: |
          # The runner image ships a newer Ansible on PATH. Lint imports the
          # apt module, so both commands must use the apt CLI.
          export PATH="/usr/bin:${PATH}"
          ansible-playbook --version
          ansible-playbook --syntax-check install.yml

      - name: Lint Ansible
        run: |
          export PATH="/usr/bin:${PATH}"
          ansible --version
          ansible-lint ansible/install.yml

  iso:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-jinja2 python3-yaml xorriso curl ca-certificates

      - name: Configure the SSH public key
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          import yaml

          from maas_deploy.config import SCHEMA_MODE, load_config, validate

          keys = [line.strip() for line in os.environ["SSH_PUBLIC_KEY"].splitlines() if line.strip()]
          if not keys:
              raise SystemExit("Set the SSH_PUBLIC_KEY repository Actions secret to your SSH public key.")
          path = Path("config/deployment.yaml")
          document = yaml.safe_load(path.read_text(encoding="utf-8"))
          document["deployment"]["ssh_authorized_keys"] = keys
          path.write_text(yaml.safe_dump(document, sort_keys=False), encoding="utf-8")
          validate(load_config(Path("config/network.yaml"), path), SCHEMA_MODE)
          PY

      - name: Build the autoinstall ISO
        run: |
          chmod +x scripts/*.sh
          scripts/build-iso.sh

      - name: Upload the ISO, checksum, and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-maas-autoinstall
          path: |
            build/ubuntu-maas-autoinstall.iso
            build/SHA256SUMS
            build/build-manifest.json
          if-no-files-found: error
          retention-days: 14
