name: Full ISO installation smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install VM and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml python3-jinja2 python3-jsonschema openssh-client xorriso qemu-utils qemu-system-x86 ovmf curl ca-certificates
          if [[ -e /dev/kvm ]]; then
            sudo setfacl -m "u:${USER}:rw" /dev/kvm
          fi
          python3 - <<'PY'
          import shutil
          if shutil.disk_usage('/').free < 18 * 1024**3:
              raise SystemExit('At least 18 GiB free is required for ISO and disposable VM disk.')
          PY
      - name: Download official source ISO
        run: |
          mkdir -p "$RUNNER_TEMP/ubuntu-source"
          curl -fLsS --retry 3 https://releases.ubuntu.com/24.04.5/SHA256SUMS -o "$RUNNER_TEMP/ubuntu-source/SHA256SUMS"
          curl -fLsS --retry 3 https://releases.ubuntu.com/24.04.5/ubuntu-24.04.5-live-server-amd64.iso -o "$RUNNER_TEMP/ubuntu-source/ubuntu.iso"
      - name: Install and validate an isolated controller
        run: |
          python3 scripts/test-install-vm.py \
            --iso "$RUNNER_TEMP/ubuntu-source/ubuntu.iso" \
            --sums "$RUNNER_TEMP/ubuntu-source/SHA256SUMS" \
            --work "$RUNNER_TEMP/homelab-vm" \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Retain only synthetic-test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installation-smoke-diagnostics
          path: |
            ${{ runner.temp }}/homelab-vm/*.log
            ${{ runner.temp }}/homelab-vm/screen.png
            ${{ runner.temp }}/homelab-vm/result.json
          retention-days: 1
          if-no-files-found: ignore
