name: Check installation variables
description: Resolve repository variables, apply defaults, and validate installation readiness.
inputs:
  variables-json:
    description: Non-sensitive repository configuration variables serialized as JSON.
    required: true
  secrets-json:
    description: Explicit allowlist of topology and disk secrets serialized as JSON.
    required: true
  write-config:
    description: Write validated configuration into the runner checkout for ISO construction.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Check required variables and resolve defaults
      shell: bash
      env:
        ACTIONS_VARIABLES_JSON: ${{ inputs.variables-json }}
        ACTIONS_SECRETS_JSON: ${{ inputs.secrets-json }}
        WRITE_CONFIG: ${{ inputs.write-config }}
      run: |
        args=()
        if [[ "$WRITE_CONFIG" == "true" ]]; then
          args+=(--write-config)
        fi
        python3 scripts/configure-actions.py "${args[@]}"
